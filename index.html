<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cálculos Eléctricos</title>
<meta name="description" content="Calculadoras eléctricas para presupuestos e instalaciones: caída de tensión, sección de cable, protecciones, tablero, iluminación y más.">
<meta name="theme-color" content="#1e1e2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
<script>
(function () {
  var saved = localStorage.getItem('ce-theme');
  if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
})();
</script>
</head>
<body>
<div id="app"></div>
<button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Cambiar tema"></button>
<script type="module" src="app.js"></script>
</body>
</html>
